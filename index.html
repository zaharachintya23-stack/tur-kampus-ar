<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Tur Kampus</title>
<style>
  :root { --bg:#10201a; --fg:#f2f5ee; --acc:#f2b84b; --bad:#ff7a6b; }
  * { box-sizing: border-box; }
  html { background:#000; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--fg);
    font:16px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }
  .hud { z-index:2; position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
    background:linear-gradient(rgba(16,32,26,.85), rgba(16,32,26,0)); pointer-events:none; }
  .hud b { color:var(--acc); }
  #gps { font-size:13px; opacity:.9; }
  #gps.warn { color:var(--bad); opacity:1; }
  #start { z-index:10; position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:24px; text-align:center; background:var(--bg); }
  #start h1 { margin:0; font-size:28px; }
  #start p { margin:0; max-width:32ch; opacity:.85; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:14px 22px; min-height:48px;
    background:var(--acc); color:#1b1b1b; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  #err { color:var(--bad); max-width:34ch; min-height:1.4em; }
  #sheet { z-index:3; position:fixed; left:0; right:0; bottom:0; padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    background:var(--bg); border-radius:18px 18px 0 0; transform:translateY(110%); transition:transform .2s; }
  #sheet.open { transform:none; }
  #sheet h2 { margin:0 0 4px; font-size:20px; }
  #sheet p { margin:0 0 12px; opacity:.9; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) { #sheet { transition:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud" hidden>
  <div id="progress"></div>
  <div id="nearest"></div>
  <div id="gps">Menunggu sinyal GPS...</div>
</div>
<div id="sheet" role="dialog" aria-live="polite">
  <h2 id="sName"></h2><p id="sDesc"></p><p id="sDist"></p>
  <button id="sClose">Tutup</button>
</div>
<div id="start">
  <h1>AR Tur Kampus</h1>
  <p>Jalan di sekitar kampus. Objek 3D muncul di titik gedung, ketuk objeknya untuk lihat infonya.</p>
  <button id="go">Mulai tur</button>
  <div id="err" role="alert"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
